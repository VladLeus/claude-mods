name: specs

# Runs every mod's tests and validation on each PR and on main.
# `pull_request` (not `pull_request_target`): PR code runs with a read-only
# token and no secrets. Actions are pinned to commit SHAs.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: specs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  specs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mod: [autopilot, agent-fleet]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install Claude Code (pinned)
        run: npm install -g --ignore-scripts=false @anthropic-ai/claude-code@2.1.295
      - name: Validate
        run: claude plugin validate "${{ matrix.mod }}"
      - name: Test
        run: claude plugin test "${{ matrix.mod }}"

  marketplace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install Claude Code (pinned)
        run: npm install -g --ignore-scripts=false @anthropic-ai/claude-code@2.1.295
      - name: Validate marketplace
        run: claude plugin validate .
